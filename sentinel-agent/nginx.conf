# Sentinel AI — nginx reverse proxy for sentinel-agent
# Place at: /etc/nginx/sites-available/sentinel-agent
# Enable:   ln -s /etc/nginx/sites-available/sentinel-agent /etc/nginx/sites-enabled/
#
# Requirements:
#   - Replace AGENT_DOMAIN with your actual domain (e.g. agent.yourdomain.com)
#   - Run certbot to obtain SSL certificate before enabling HTTPS block
#   - The agent must be running on localhost:9090

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name AGENT_DOMAIN;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS reverse proxy ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name AGENT_DOMAIN;

    # SSL certificates (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/AGENT_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/AGENT_DOMAIN/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (1 year, include subdomains)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # CORS — allow requests from Vercel frontend and localhost dev
    set $cors_origin "";
    if ($http_origin ~* "^https://(.+\.vercel\.app|localhost)(:[0-9]+)?$") {
        set $cors_origin $http_origin;
    }
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Agent-Secret" always;
    add_header Access-Control-Max-Age       86400 always;

    # Handle preflight requests
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ─── /health endpoint ─────────────────────────────────────────────────────
    location /health {
        proxy_pass         http://127.0.0.1:9090/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # ─── /metrics endpoint (restrict to trusted IPs in production) ────────────
    location /metrics {
        # Uncomment to restrict access to monitoring IPs only:
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass         http://127.0.0.1:9090/metrics;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # ─── All other agent API endpoints ────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        client_max_body_size 10m;
    }
}
