name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ops scripts contract tests
        run: npm run test:ops:contracts

      - name: Run quality check
        run: npm run quality:check

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  test-stability-trio:
    name: Test Stability Trio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run heap-safe trio stability tests
        run: npm run test:trio:stable

  test-dashboard-stability:
    name: Test Dashboard Stability
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run heap-safe dashboard stability tests
        run: npm run test:dashboard:stable

  smoke-e2e-release:
    name: Smoke E2E (Release)
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.ref == 'refs/heads/main' && secrets.SENTINEL_SUPABASE_URL != '' && secrets.SENTINEL_SERVICE_ROLE_KEY != '' && secrets.SENTINEL_AGENT_SECRET != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare smoke env
        shell: bash
        run: |
          mkdir -p sentinel-agent
          cat > sentinel-agent/.env << 'EOF'
          SUPABASE_URL=${{ secrets.SENTINEL_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SENTINEL_SERVICE_ROLE_KEY }}
          AGENT_SECRET=${{ secrets.SENTINEL_AGENT_SECRET }}
          EOF

      - name: Run smoke pipeline check
        shell: pwsh
        run: |
          $output = powershell -ExecutionPolicy Bypass -File scripts/smoke-pipeline-safe.ps1 -ControlledFailure -WaitForCompletion -TimeoutSeconds 240 -PollIntervalSeconds 4
          $json = $output | Out-String | ConvertFrom-Json

          if ($json.dispatch_http -ne 200) {
            throw "Smoke dispatch failed. HTTP=$($json.dispatch_http)"
          }

          if ($json.result_http -ne 200) {
            throw "Smoke result callback failed. HTTP=$($json.result_http)"
          }

          if ($json.log_count -lt 3) {
            throw "Smoke lifecycle logs insufficient. log_count=$($json.log_count)"
          }

          if (-not $json.wait_for_completion) {
            throw "Smoke wait_for_completion=false. CI gate must enforce terminal status."
          }

          if ($json.final_scan_status -notin @('completed', 'failed', 'error')) {
            throw "Smoke scan did not reach terminal status in time. final_scan_status=$($json.final_scan_status)"
          }

          if ($json.final_scan_status -ne 'failed') {
            throw "Controlled failure smoke expected failed final status, got: $($json.final_scan_status)"
          }

          $activeJobs = @($json.jobs | Where-Object { $_.status -in @('queued', 'pending', 'running') })
          if ($activeJobs.Count -gt 0) {
            throw "Smoke finished but jobs still active: $($activeJobs.Count)"
          }

          Write-Host "Smoke scan_id: $($json.scan_id)"
          Write-Host "dispatch_http=$($json.dispatch_http) result_http=$($json.result_http) final_scan_status=$($json.final_scan_status) jobs=$($json.jobs.Count) log_count=$($json.log_count)"
