name: Chaos Ops Drill

on:
  schedule:
    - cron: '15 4 * * 1'
  workflow_dispatch:
    inputs:
      run_contract_suite:
        description: "Run full ops contract fault-injection suite (true/false)"
        required: false
        default: "true"
      run_dependency_degradation_checks:
        description: "Run dependency degradation scenarios (true/false)"
        required: false
        default: "true"
      send_webhook_on_failure:
        description: "Send operational webhook when drill fails (true/false)"
        required: false
        default: "true"

jobs:
  chaos-drill:
    name: Run Chaos Fault-Injection Drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: chaos-ops-drill
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Execute chaos drill
        id: drill
        shell: pwsh
        env:
          INPUT_RUN_CONTRACT_SUITE: ${{ github.event.inputs.run_contract_suite }}
          INPUT_RUN_DEPENDENCY_DEGRADATION_CHECKS: ${{ github.event.inputs.run_dependency_degradation_checks }}
          INPUT_SEND_WEBHOOK_ON_FAILURE: ${{ github.event.inputs.send_webhook_on_failure }}
        run: |
          $runContractSuite = if ([string]::IsNullOrWhiteSpace($env:INPUT_RUN_CONTRACT_SUITE)) { $true } else { [bool]::Parse($env:INPUT_RUN_CONTRACT_SUITE) }
          $runDependencyDegradationChecks = if ([string]::IsNullOrWhiteSpace($env:INPUT_RUN_DEPENDENCY_DEGRADATION_CHECKS)) { $true } else { [bool]::Parse($env:INPUT_RUN_DEPENDENCY_DEGRADATION_CHECKS) }
          $sendWebhookOnFailure = if ([string]::IsNullOrWhiteSpace($env:INPUT_SEND_WEBHOOK_ON_FAILURE)) { $true } else { [bool]::Parse($env:INPUT_SEND_WEBHOOK_ON_FAILURE) }

          function Get-Sha256Hex {
            param([string]$Text)

            $sha = [System.Security.Cryptography.SHA256]::Create()
            try {
              $bytes = [System.Text.Encoding]::UTF8.GetBytes($Text)
              $hash = $sha.ComputeHash($bytes)
              return ([System.BitConverter]::ToString($hash)).Replace('-', '').ToLowerInvariant()
            } finally {
              $sha.Dispose()
            }
          }

          New-Item -ItemType Directory -Force -Path reports | Out-Null

          function Invoke-DegradationScenario {
            param(
              [string]$Name,
              [string]$Url,
              [int]$TimeoutSec = 3
            )

            $startedAt = Get-Date
            try {
              $resp = Invoke-WebRequest -Method 'GET' -Uri $Url -TimeoutSec $TimeoutSec -UseBasicParsing
              $durationMs = [math]::Round(((Get-Date) - $startedAt).TotalMilliseconds, 1)
              return [pscustomobject]@{
                scenario = $Name
                url = $Url
                expected_failure = $true
                observed_failure = $false
                passed = $false
                status_code = $resp.StatusCode
                duration_ms = $durationMs
                error = $null
              }
            } catch {
              $durationMs = [math]::Round(((Get-Date) - $startedAt).TotalMilliseconds, 1)
              return [pscustomobject]@{
                scenario = $Name
                url = $Url
                expected_failure = $true
                observed_failure = $true
                passed = $true
                status_code = $null
                duration_ms = $durationMs
                error = $_.Exception.Message
              }
            }
          }

          if (-not $runContractSuite) {
            $generatedAt = (Get-Date).ToUniversalTime()
            $report = [pscustomobject]@{
              schema_version = '1.0'
              report_type = 'chaos_ops_drill'
              executed = $false
              reason = 'run_contract_suite=false'
              generated_at = $generatedAt.ToString('o')
              workflow = 'chaos-ops-drill.yml'
              dependency_degradation = [pscustomobject]@{
                enabled = $false
                reason = 'run_contract_suite=false'
                scenarios = @()
                all_passed = $true
              }
            }

            $payloadHash = Get-Sha256Hex -Text ($report | ConvertTo-Json -Depth 10 -Compress)
            $report | Add-Member -NotePropertyName evidence_id -NotePropertyValue ("chaos-drill-$($generatedAt.ToString('yyyyMMddTHHmmssZ'))-$($payloadHash.Substring(0, 12))")
            $report | Add-Member -NotePropertyName integrity -NotePropertyValue ([pscustomobject]@{ algorithm = 'sha256'; payload_hash = $payloadHash })

            ($report | ConvertTo-Json -Depth 8) | Out-File -Encoding utf8 reports/chaos-ops-drill.json
            "send_webhook_on_failure=$($sendWebhookOnFailure.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "evidence_id=$($report.evidence_id) payload_hash=$($report.integrity.payload_hash)"
            Write-Host 'Chaos drill skipped by input flag.'
            exit 0
          }

          $output = node scripts/test-ops-scripts.cjs 2>&1
          $exitCode = $LASTEXITCODE
          $generatedAt = (Get-Date).ToUniversalTime()

          $degradationResults = @()
          if ($runDependencyDegradationChecks) {
            $degradationResults += Invoke-DegradationScenario -Name 'dns-resolution-failure' -Url 'http://nonexistent.invalid/' -TimeoutSec 3
            $degradationResults += Invoke-DegradationScenario -Name 'connection-refused' -Url 'http://127.0.0.1:9/' -TimeoutSec 3
          }
          $degradationPassed = @($degradationResults | Where-Object { -not $_.passed }).Count -eq 0
          if (-not $runDependencyDegradationChecks) {
            $degradationPassed = $true
          }

          $effectiveExitCode = if ($exitCode -ne 0) { $exitCode } elseif (-not $degradationPassed) { 97 } else { 0 }

          $report = [pscustomobject]@{
            schema_version = '1.0'
            report_type = 'chaos_ops_drill'
            executed = $true
            generated_at = $generatedAt.ToString('o')
            workflow = 'chaos-ops-drill.yml'
            command = 'node scripts/test-ops-scripts.cjs'
            success = ($effectiveExitCode -eq 0)
            exit_code = $effectiveExitCode
            output_excerpt = ($output | Select-Object -Last 80)
            dependency_degradation = [pscustomobject]@{
              enabled = $runDependencyDegradationChecks
              scenarios = @($degradationResults)
              all_passed = $degradationPassed
            }
          }

          $payloadHash = Get-Sha256Hex -Text ($report | ConvertTo-Json -Depth 12 -Compress)
          $report | Add-Member -NotePropertyName evidence_id -NotePropertyValue ("chaos-drill-$($generatedAt.ToString('yyyyMMddTHHmmssZ'))-$($payloadHash.Substring(0, 12))")
          $report | Add-Member -NotePropertyName integrity -NotePropertyValue ([pscustomobject]@{ algorithm = 'sha256'; payload_hash = $payloadHash })

          ($report | ConvertTo-Json -Depth 10) | Out-File -Encoding utf8 reports/chaos-ops-drill.json
          "evidence_id=$($report.evidence_id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "drill_success=$($report.success.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "send_webhook_on_failure=$($sendWebhookOnFailure.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "evidence_id=$($report.evidence_id) payload_hash=$($report.integrity.payload_hash) success=$($report.success)"

          if (-not $report.success) {
            throw "Chaos drill failed. ExitCode=$($report.exit_code)"
          }

      - name: Notify drill failure
        if: failure() && steps.drill.outputs.send_webhook_on_failure == 'true'
        shell: pwsh
        env:
          OPERATIONAL_ALERT_WEBHOOK_URL: ${{ secrets.OPERATIONAL_ALERT_WEBHOOK_URL }}
        run: |
          if (-not $env:OPERATIONAL_ALERT_WEBHOOK_URL) { exit 0 }
          if (-not (Test-Path 'reports/chaos-ops-drill.json')) {
            throw 'chaos-ops-drill report not found for failure notification'
          }

          $report = Get-Content 'reports/chaos-ops-drill.json' -Raw | ConvertFrom-Json
          $payload = [pscustomobject]@{
            event = 'chaos_ops_drill_failed'
            source = 'sentinel-agent-ops'
            severity = 'critical'
            evidence_id = $report.evidence_id
            summary = [pscustomobject]@{
              success = $report.success
              exit_code = $report.exit_code
              workflow = $report.workflow
              generated_at = $report.generated_at
            }
          }

          $jsonBody = $payload | ConvertTo-Json -Depth 10
          $resp = Invoke-WebRequest -Method 'POST' -Uri $env:OPERATIONAL_ALERT_WEBHOOK_URL -Headers @{ 'Content-Type' = 'application/json' } -Body $jsonBody -UseBasicParsing
          if ($resp.StatusCode -lt 200 -or $resp.StatusCode -ge 300) {
            throw "Chaos failure webhook failed. HTTP=$($resp.StatusCode)"
          }

      - name: Upload chaos drill artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-ops-drill
          path: reports/chaos-ops-drill.json
          if-no-files-found: error

      - name: Verify evidence integrity
        if: always()
        shell: bash
        run: |
          node scripts/verify-evidence-integrity.cjs --report-file reports/chaos-ops-drill.json
