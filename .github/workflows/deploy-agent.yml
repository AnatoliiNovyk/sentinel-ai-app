name: Deploy Sentinel Agent to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'sentinel-agent/**'
  workflow_dispatch:

concurrency:
  group: deploy-agent
  cancel-in-progress: false   # Never cancel an in-flight deploy

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── Verify TypeScript builds locally before SSH ──────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sentinel-agent/package-lock.json

      - name: Install & build (CI validation)
        working-directory: sentinel-agent
        run: npm ci && npm run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          script: |
            set -e

            echo "🔐 Checking passwordless sudo..."
            sudo -n true

            echo "📥 Pulling latest code..."
            sudo git config --global --add safe.directory /opt/sentinel-agent-repo
            cd /opt/sentinel-agent-repo && sudo git pull

            echo "📂 Syncing files..."
            sudo cp -r /opt/sentinel-agent-repo/sentinel-agent/src /opt/sentinel-agent/
            sudo cp /opt/sentinel-agent-repo/sentinel-agent/package.json /opt/sentinel-agent/package.json
            sudo cp /opt/sentinel-agent-repo/sentinel-agent/tsconfig.json /opt/sentinel-agent/tsconfig.json

            echo "📦 Installing dependencies..."
            cd /opt/sentinel-agent
            sudo rm -rf node_modules
            sudo npm ci --omit=dev

            echo "🧰 Ensuring scanner runtime dependencies..."
            if ! command -v nmap >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y nmap
            fi

            echo "🔨 Building..."
            sudo npm run build

            echo "🔄 Restarting service..."
            sudo systemctl restart sentinel-agent

            echo "🔃 Reloading nginx config..."
            sudo cp /opt/sentinel-agent-repo/sentinel-agent/nginx.conf /etc/nginx/sites-available/sentinel-agent 2>/dev/null || true
            sudo nginx -t && sudo systemctl reload nginx || echo "nginx not configured yet — skipping"

            echo "✅ Deploy complete."
            sudo systemctl status sentinel-agent --no-pager

            echo "🩺 Checking local health endpoint..."
            HEALTH_OK=0
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:9090/health >/tmp/sentinel-health.json; then
                HEALTH_OK=1
                break
              fi
              sleep 1
            done
            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "❌ Health endpoint not ready after retry window"
              sudo journalctl -u sentinel-agent -n 120 --no-pager
              exit 1
            fi
            head -c 400 /tmp/sentinel-health.json
            echo ""

            echo "📊 Checking watchdog metrics presence..."
            METRICS_OK=0
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:9090/metrics >/tmp/sentinel-metrics.txt; then
                METRICS_OK=1
                break
              fi
              sleep 1
            done
            if [ "$METRICS_OK" -ne 1 ]; then
              echo "❌ Metrics endpoint not ready after retry window"
              sudo journalctl -u sentinel-agent -n 120 --no-pager
              exit 1
            fi
            grep -E "sentinel_stale_jobs_recovered_total|sentinel_stale_scans_recovered_total|sentinel_end_to_end_duration_ms_avg" /tmp/sentinel-metrics.txt
