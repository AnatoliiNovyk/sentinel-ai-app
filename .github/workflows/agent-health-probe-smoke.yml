name: Agent Health Probe Smoke

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      probe_url:
        description: "Optional probe URL override"
        required: false
        default: ""
      require_reachable:
        description: "Fail run when probe is unreachable (true/false)"
        required: false
        default: "true"

jobs:
  probe-smoke:
    name: Probe ai-gateway agent health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: agent-health-probe-smoke
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare probe env
        shell: bash
        run: |
          mkdir -p sentinel-agent
          cat > sentinel-agent/.env << 'EOF'
          SUPABASE_URL=${{ secrets.SENTINEL_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SENTINEL_SERVICE_ROLE_KEY }}
          AGENT_HEALTH_URL=${{ secrets.SENTINEL_AGENT_HEALTH_URL }}
          OPERATIONAL_ALERT_WEBHOOK_URL=${{ secrets.OPERATIONAL_ALERT_WEBHOOK_URL }}
          EOF

      - name: Run gateway probe smoke
        shell: pwsh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_PROBE_URL: ${{ github.event.inputs.probe_url }}
          INPUT_REQUIRE_REACHABLE: ${{ github.event.inputs.require_reachable }}
        run: |
          $probeUrl = if ([string]::IsNullOrWhiteSpace($env:INPUT_PROBE_URL)) { '' } else { $env:INPUT_PROBE_URL }
          $defaultRequireReachable = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $true } else { $false }
          $requireReachable = if ([string]::IsNullOrWhiteSpace($env:INPUT_REQUIRE_REACHABLE)) { $defaultRequireReachable } else { [bool]::Parse($env:INPUT_REQUIRE_REACHABLE) }

          $args = @(
            '-ExecutionPolicy', 'Bypass',
            '-File', 'scripts/agent-health-probe-smoke.ps1',
            '-EnvFile', 'sentinel-agent/.env',
            '-TimeoutSeconds', '12'
          )

          if (-not [string]::IsNullOrWhiteSpace($probeUrl)) {
            $args += @('-ProbeUrl', $probeUrl)
          }

          if ($requireReachable) {
            $args += '-RequireReachable'
          }

          $probeFailed = $false
          $json = $null

          try {
            $output = powershell @args
            if ($LASTEXITCODE -ne 0) {
              throw "Probe script failed with exit code $LASTEXITCODE"
            }
            $json = $output | Out-String | ConvertFrom-Json
          } catch {
            $probeFailed = $true
            $json = [pscustomobject]@{
              schema_version = '1.0'
              report_type = 'agent_health_probe_smoke'
              generated_at = (Get-Date).ToUniversalTime().ToString('o')
              gateway_http = $null
              request_id = $null
              action = 'agent_health_probe'
              status = 'error'
              reachable = $false
              http_status = $null
              error = $_.Exception.Message
              probed_url = if ([string]::IsNullOrWhiteSpace($probeUrl)) { $null } else { $probeUrl }
              timeout_seconds = 12
              require_reachable = $requireReachable
            }
          }

          New-Item -ItemType Directory -Force -Path reports | Out-Null
          ($json | ConvertTo-Json -Depth 12) | Out-File -Encoding utf8 reports/agent-health-probe-smoke.json

          Write-Host "request_id=$($json.request_id) reachable=$($json.reachable) http_status=$($json.http_status) status=$($json.status)"

          if ($probeFailed -and $requireReachable) {
            throw "Probe smoke failed in strict mode: $($json.error)"
          }

      - name: Persist probe status to audit log
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          node scripts/persist-agent-probe-audit.cjs \
            --env-file sentinel-agent/.env \
            --report-file reports/agent-health-probe-smoke.json \
            --workflow "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-number "${{ github.run_number }}"

      - name: Escalate probe failure
        if: failure()
        shell: pwsh
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.OPERATIONAL_ALERT_WEBHOOK_URL }}
        run: |
          if (-not $env:ALERT_WEBHOOK_URL) { exit 0 }
          $report = $null
          if (Test-Path 'reports/agent-health-probe-smoke.json') {
            $report = Get-Content 'reports/agent-health-probe-smoke.json' -Raw | ConvertFrom-Json
          }

          $payload = @{
            event = 'agent_health_probe_smoke_failed'
            severity = 'high'
            repository = '${{ github.repository }}'
            workflow = '${{ github.workflow }}'
            run_id = '${{ github.run_id }}'
            run_number = '${{ github.run_number }}'
            run_url = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            timestamp = (Get-Date).ToUniversalTime().ToString('o')
            probe = @{
              status = if ($null -ne $report) { $report.status } else { 'unknown' }
              reachable = if ($null -ne $report) { $report.reachable } else { $null }
              http_status = if ($null -ne $report) { $report.http_status } else { $null }
              error = if ($null -ne $report) { $report.error } else { 'probe report unavailable' }
              probed_url = if ($null -ne $report) { $report.probed_url } else { $null }
              request_id = if ($null -ne $report) { $report.request_id } else { $null }
            }
          }

          $json = $payload | ConvertTo-Json -Depth 10
          Invoke-RestMethod -Method POST -Uri $env:ALERT_WEBHOOK_URL -ContentType 'application/json' -Body $json | Out-Null
          Write-Host 'Probe failure alert sent to operational webhook.'

      - name: Upload probe report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-health-probe-smoke
          path: reports/agent-health-probe-smoke.json
          if-no-files-found: warn