name: Agent Health Probe Smoke

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      probe_url:
        description: "Optional probe URL override"
        required: false
        default: ""
      require_reachable:
        description: "Fail run when probe is unreachable (true/false)"
        required: false
        default: "true"

jobs:
  probe-smoke:
    name: Probe ai-gateway agent health
    runs-on: ubuntu-latest
    if: secrets.SENTINEL_SUPABASE_URL != '' && secrets.SENTINEL_SERVICE_ROLE_KEY != '' && secrets.SENTINEL_AGENT_HEALTH_URL != ''
    timeout-minutes: 10
    concurrency:
      group: agent-health-probe-smoke
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare probe env
        shell: bash
        run: |
          mkdir -p sentinel-agent
          cat > sentinel-agent/.env << 'EOF'
          SUPABASE_URL=${{ secrets.SENTINEL_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SENTINEL_SERVICE_ROLE_KEY }}
          AGENT_HEALTH_URL=${{ secrets.SENTINEL_AGENT_HEALTH_URL }}
          OPERATIONAL_ALERT_WEBHOOK_URL=${{ secrets.OPERATIONAL_ALERT_WEBHOOK_URL }}
          EOF

      - name: Run gateway probe smoke
        shell: pwsh
        env:
          INPUT_PROBE_URL: ${{ github.event.inputs.probe_url }}
          INPUT_REQUIRE_REACHABLE: ${{ github.event.inputs.require_reachable }}
        run: |
          $probeUrl = if ([string]::IsNullOrWhiteSpace($env:INPUT_PROBE_URL)) { '' } else { $env:INPUT_PROBE_URL }
          $requireReachable = if ([string]::IsNullOrWhiteSpace($env:INPUT_REQUIRE_REACHABLE)) { $true } else { [bool]::Parse($env:INPUT_REQUIRE_REACHABLE) }

          $args = @(
            '-ExecutionPolicy', 'Bypass',
            '-File', 'scripts/agent-health-probe-smoke.ps1',
            '-EnvFile', 'sentinel-agent/.env',
            '-TimeoutSeconds', '12'
          )

          if (-not [string]::IsNullOrWhiteSpace($probeUrl)) {
            $args += @('-ProbeUrl', $probeUrl)
          }

          if ($requireReachable) {
            $args += '-RequireReachable'
          }

          $output = powershell @args
          $json = $output | Out-String | ConvertFrom-Json

          New-Item -ItemType Directory -Force -Path reports | Out-Null
          ($json | ConvertTo-Json -Depth 12) | Out-File -Encoding utf8 reports/agent-health-probe-smoke.json

          Write-Host "request_id=$($json.request_id) reachable=$($json.reachable) http_status=$($json.http_status) status=$($json.status)"

      - name: Persist probe status to audit log
        if: always()
        shell: pwsh
        run: |
          $envContent = Get-Content 'sentinel-agent/.env' -Raw

          $getEnv = {
            param([string]$text, [string]$key)
            $match = [regex]::Match($text, "(?m)^$key\s*=\s*(.+)$")
            if (-not $match.Success) { return '' }
            return $match.Groups[1].Value.Trim().Trim('"').Trim("'")
          }

          $supabaseUrl = & $getEnv $envContent 'SUPABASE_URL'
          $serviceKey = & $getEnv $envContent 'SUPABASE_SERVICE_ROLE_KEY'

          if ([string]::IsNullOrWhiteSpace($supabaseUrl) -or [string]::IsNullOrWhiteSpace($serviceKey)) {
            Write-Host 'Skip audit log persistence: missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY.'
            exit 0
          }

          $headers = @{
            'apikey' = $serviceKey
            'Authorization' = "Bearer $serviceKey"
            'Content-Type' = 'application/json'
          }

          $projectResp = Invoke-WebRequest -Method GET -Uri "$supabaseUrl/rest/v1/projects?select=id,org_id,user_id&limit=1" -Headers $headers -UseBasicParsing
          if ($projectResp.StatusCode -ne 200) {
            Write-Host "Skip audit log persistence: projects lookup HTTP=$($projectResp.StatusCode)."
            exit 0
          }

          $projects = $projectResp.Content | ConvertFrom-Json
          if ($null -eq $projects -or $projects.Count -eq 0) {
            Write-Host 'Skip audit log persistence: no projects found to resolve org/user context.'
            exit 0
          }

          $project = $projects[0]
          $report = $null
          if (Test-Path 'reports/agent-health-probe-smoke.json') {
            $report = Get-Content 'reports/agent-health-probe-smoke.json' -Raw | ConvertFrom-Json
          }

          $probeStatus = if ($null -ne $report -and $report.status) { [string]$report.status } else { 'error' }
          $auditStatus = if ($probeStatus -eq 'ok') { 'success' } else { 'failure' }

          $metadata = @{
            status = $probeStatus
            reachable = if ($null -ne $report) { $report.reachable } else { $false }
            http_status = if ($null -ne $report) { $report.http_status } else { $null }
            request_id = if ($null -ne $report) { $report.request_id } else { $null }
            probed_url = if ($null -ne $report) { $report.probed_url } else { $null }
            error = if ($null -ne $report) { $report.error } else { 'probe report unavailable' }
            generated_at = if ($null -ne $report) { $report.generated_at } else { (Get-Date).ToUniversalTime().ToString('o') }
            workflow = '${{ github.workflow }}'
            run_id = '${{ github.run_id }}'
            run_number = '${{ github.run_number }}'
          }

          $payload = @{
            org_id = [string]$project.org_id
            user_id = [string]$project.user_id
            action = 'agent_health_probe_smoke'
            resource_type = 'workflow'
            resource_id = '${{ github.run_id }}'
            status = $auditStatus
            error_code = if ($probeStatus -eq 'ok') { $null } else { 'AGENT_PROBE_SMOKE_FAILED' }
            error_message = if ($probeStatus -eq 'ok') { $null } else { [string]$metadata.error }
            metadata = $metadata
            created_at = (Get-Date).ToUniversalTime().ToString('o')
          }

          $body = $payload | ConvertTo-Json -Depth 12
          $insertResp = Invoke-WebRequest -Method POST -Uri "$supabaseUrl/rest/v1/audit_logs" -Headers $headers -Body $body -UseBasicParsing
          if ($insertResp.StatusCode -lt 200 -or $insertResp.StatusCode -ge 300) {
            throw "Audit log insert failed. HTTP=$($insertResp.StatusCode) body=$($insertResp.Content)"
          }
          Write-Host 'Probe smoke status persisted to audit_logs.'

      - name: Escalate probe failure
        if: failure() && secrets.OPERATIONAL_ALERT_WEBHOOK_URL != ''
        shell: pwsh
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.OPERATIONAL_ALERT_WEBHOOK_URL }}
        run: |
          $report = $null
          if (Test-Path 'reports/agent-health-probe-smoke.json') {
            $report = Get-Content 'reports/agent-health-probe-smoke.json' -Raw | ConvertFrom-Json
          }

          $payload = @{
            event = 'agent_health_probe_smoke_failed'
            severity = 'high'
            repository = '${{ github.repository }}'
            workflow = '${{ github.workflow }}'
            run_id = '${{ github.run_id }}'
            run_number = '${{ github.run_number }}'
            run_url = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            timestamp = (Get-Date).ToUniversalTime().ToString('o')
            probe = @{
              status = if ($null -ne $report) { $report.status } else { 'unknown' }
              reachable = if ($null -ne $report) { $report.reachable } else { $null }
              http_status = if ($null -ne $report) { $report.http_status } else { $null }
              error = if ($null -ne $report) { $report.error } else { 'probe report unavailable' }
              probed_url = if ($null -ne $report) { $report.probed_url } else { $null }
              request_id = if ($null -ne $report) { $report.request_id } else { $null }
            }
          }

          $json = $payload | ConvertTo-Json -Depth 10
          Invoke-RestMethod -Method POST -Uri $env:ALERT_WEBHOOK_URL -ContentType 'application/json' -Body $json | Out-Null
          Write-Host 'Probe failure alert sent to operational webhook.'

      - name: Upload probe report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-health-probe-smoke
          path: reports/agent-health-probe-smoke.json
          if-no-files-found: error